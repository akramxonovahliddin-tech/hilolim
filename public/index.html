<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hilolim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --blue:#1f4a9e; --light:#4aa8dc; --bg:#fff; --text:#16233f; --line:#d6e2f3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:480px; margin:0 auto; padding:20px 18px 32px; }
  header { text-align:center; }
  header img { width:170px; height:auto; }
  h1 { margin:4px 0 2px; font-size:24px; color:var(--blue); letter-spacing:1px; }
  header p { margin:6px 0 20px; color:var(--blue); font-size:15px; font-weight:700; letter-spacing:2px; }
  label.f { display:block; margin:14px 0 6px; font-size:14px; font-weight:600; }
  input[type=text], input[type=tel] {
    width:100%; padding:13px 14px; font-size:16px; border:1.5px solid var(--line);
    border-radius:12px; outline:none; color:var(--text); background:#fff;
  }
  input:focus { border-color:var(--light); }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt input { display:none; }
  .opt span {
    display:block; text-align:center; padding:14px 8px; border:1.5px solid var(--line);
    border-radius:12px; font-weight:600; font-size:15px; cursor:pointer;
  }
  .opt input:checked + span { background:var(--blue); border-color:var(--blue); color:#fff; }
  button {
    width:100%; margin-top:24px; padding:15px; font-size:16px; font-weight:700;
    color:#fff; background:var(--blue); border:0; border-radius:12px; cursor:pointer;
  }
  button:disabled { opacity:.6; }
  .err { color:#d33; font-size:13px; margin-top:10px; min-height:16px; text-align:center; }
  .done { display:none; text-align:center; padding:40px 10px; }
  .done .ok { font-size:56px; }
  .done h2 { color:var(--blue); }
</style>
</head>

    <p>QABULGA YOZILISH</p>
  </header>

  <form id="form" novalidate>
    <label class="f" for="fn">Ism</label>
    <input type="text" id="fn" autocomplete="given-name" maxlength="50">

    <label class="f" for="ln">Familiya</label>
    <input type="text" id="ln" autocomplete="family-name" maxlength="50">

    <label class="f" for="ph">Telefon raqam</label>
    <input type="tel" id="ph" placeholder="+998 90 123 45 67" autocomplete="tel" value="+998 ">

    <label class="f">Arab tili kursi</label>
    <div class="opts">
      <label class="opt"><input type="radio" name="course" value="fonetika"><span>Fonetika guruhi</span></label>
      <label class="opt"><input type="radio" name="course" value="grammatika"><span>Grammatika guruhi</span></label>
    </div>

    <div class="err" id="err"></div>
    <button type="submit" id="btn">Yuborish</button>
  </form>

  <div class="done" id="done">
    <div class="ok">✅</div>
    <h2>Arizangiz yuborildi!</h2>
    <p>Tez orada siz bilan bog'lanamiz.</p>
  </div>
</div>

<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = (id) => document.getElementById(id);
  const phone = $("ph");

  // +998 XX XXX XX XX formatlash
  phone.addEventListener("input", () => {
    let d = phone.value.replace(/\D/g, "");
    if (!d.startsWith("998")) d = "998" + d.replace(/^998?/, "");
    d = d.slice(0, 12);
    const p = [d.slice(0,3), d.slice(3,5), d.slice(5,8), d.slice(8,10), d.slice(10,12)].filter(Boolean);
    phone.value = "+" + p.join(" ");
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("err"); err.textContent = "";
    const firstName = $("fn").value.trim();
    const lastName = $("ln").value.trim();
    const course = (document.querySelector('input[name=course]:checked') || {}).value;

    if (!firstName || !lastName) return err.textContent = "Ism va familiyani kiriting";
    if (phone.value.replace(/\D/g, "").length < 12) return err.textContent = "Telefon raqamni to'liq kiriting";
    if (!course) return err.textContent = "Kurs turini tanlang";

    const btn = $("btn"); btn.disabled = true; btn.textContent = "Yuborilmoqda...";
    try {
      const r = await fetch("/api/enroll", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ firstName, lastName, phone: phone.value, course }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error();
      $("form").style.display = "none";
      $("done").style.display = "block";
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch {
      err.textContent = "Xatolik yuz berdi, qayta urinib ko'ring";
      btn.disabled = false; btn.textContent = "Yuborish";
    }
  });
</script>
